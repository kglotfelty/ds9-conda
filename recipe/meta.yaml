{% set name = "ds9" %}
{% set version = "8.8" %}
{% set number = "0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://ds9.si.edu/download/source/SAOImageDS9-{{ version }}.tar.gz
  sha256: a035469e98e0912be98ceb7d451120866cb48843a5b179b9768bc862ed048a6e
  #~ git_url: https://github.com/SAOImageDS9/SAOImageDS9
  #~ git_ref: de3a02eeec52b08240687506d2f92d9076247a07

build:
  number: {{ number }}

requirements:
  build:
    - {{ compiler("c") }}
    - {{ compiler("cxx") }}
    - libclang-cpp  # [osx]
    - make
    - autoconf
    - automake
    - m4
    - pkg-config
    - bison
    - flex

  host:
    # The host requirements are longer than expected to get Tk to
    # build with support for true-type fonts (look for 'xft' enable
    # in configure output).
    - bzip2
    - expat
    - fontconfig
    - libfreetype
    - libiconv
    - libpng
    - libxml2-devel
    - libxslt
    - libuuid
    - icu >=75.1, <76.0a0
    - zlib
    - xorg-kbproto
    - xorg-libx11
    - xorg-libXft
    - xorg-libxrender
    - xorg-renderproto
    - xorg-xorgproto
    - xorg-xproto

  run:
    - xorg-libxft
    - icu

about:
  home: https://ds9.si.edu
  license: GPL-3.0-only
  license_family: GPL
  summary: Astronomical image display and analysis application
  dev_url: https://github.com/SAOImageDS9/SAOImageDS9
  description: |
      SAOImageDS9 is an astronomical imaging and data visualization
      application.  DS9 supports FITS images and binary tables,
      multiple frame buffers, region manipulation, and many
      scale algorithms and colormaps.  It provides for easy
      communication with external analysis tasks and is highly
      configurable and extensible via XPA and SAMP.

extra:
  recipe-maintainers:
    - kglotfelty
